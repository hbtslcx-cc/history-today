name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Fix gradlew permissions and line endings
      working-directory: history-today-android
      run: |
        chmod +x gradlew
        sed -i 's/\r$//' gradlew
    
    - name: Build Debug APK
      working-directory: history-today-android
      run: ./gradlew assembleDebug
    
    - name: Build Release APK
      working-directory: history-today-android
      run: ./gradlew assembleRelease
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: history-today-android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: history-today-android/app/build/outputs/apk/release/app-release-unsigned.apk
